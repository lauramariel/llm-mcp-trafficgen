<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trafficgen</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677084;
    --border: #dde1e8; --accent: #7855fa; --accent-text: #fff;
    --ok: #1f8a4c; --warn: #b7791f; --err: #c53030; --input: #fff; --code: #f0f2f5;
    color-scheme: light;
  }
  /* Dark tokens: used when the system is dark (unless Light is picked), or when Dark is picked. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --panel: #1b1f27; --text: #e4e7ee; --muted: #9098aa;
      --border: #2d333f; --accent: #7855fa; --accent-text: #fff;
      --ok: #48bb78; --warn: #ecc94b; --err: #fc8181; --input: #141820; --code: #141820;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --panel: #1b1f27; --text: #e4e7ee; --muted: #9098aa;
    --border: #2d333f; --accent: #7855fa; --accent-text: #fff;
    --ok: #48bb78; --warn: #ecc94b; --err: #fc8181; --input: #141820; --code: #141820;
    color-scheme: dark;
  }
  .theme { margin-left: auto; display: inline-flex; border: 1px solid var(--border); border-radius: 6px;
           overflow: hidden; }
  .theme button { border: 0; border-radius: 0; padding: 5px 8px; color: var(--muted);
                  display: inline-flex; align-items: center; }
  .theme svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2;
               stroke-linecap: round; stroke-linejoin: round; }
  .theme button + button { border-left: 1px solid var(--border); }
  .theme button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
           display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header .path { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; padding: 20px;
         max-width: 1400px; margin: 0 auto; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; padding: 16px; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            padding: 16px; margin-bottom: 16px; }
  section > h2 { font-size: 14px; margin: 0 0 12px; display: flex; justify-content: space-between;
                 align-items: center; }
  .hint { color: var(--muted); font-size: 12px; font-weight: normal; }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
               font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 12px; }
  .wide { grid-column: 1 / -1; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 6px; color: var(--text); padding-top: 18px; }
  input, textarea, select { font: inherit; color: var(--text); background: var(--input);
                            border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; width: 100%; }
  input[type=checkbox] { width: auto; }
  textarea { font-family: ui-monospace, monospace; font-size: 12px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .envtag { font-size: 11px; }
  .envtag.ok { color: var(--ok); } .envtag.missing { color: var(--err); }
  button { font: inherit; border-radius: 6px; border: 1px solid var(--border); background: var(--panel);
           color: var(--text); padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  button.small { padding: 2px 8px; font-size: 12px; }
  .side { position: sticky; top: 20px; align-self: start; }
  @media (max-width: 980px) { .side { position: static; } }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
           border: 1px solid currentColor; }
  .badge.running { color: var(--ok); } .badge.stopping { color: var(--warn); }
  .badge.error { color: var(--err); } .badge.idle, .badge.finished { color: var(--muted); }
  .msg { margin-top: 10px; font-size: 13px; white-space: pre-wrap; }
  .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  th, td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--border);
           font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .logs { background: var(--code); border-radius: 6px; padding: 8px; height: 320px; overflow: auto;
          font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .dirty { color: var(--warn); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>trafficgen</h1>
  <span class="path" id="path"></span>
  <div class="theme" role="group" aria-label="Color theme">
    <button data-theme-choice="auto" aria-label="Auto (system theme)" title="Auto (system theme)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    </button>
    <button data-theme-choice="light" aria-label="Light theme" title="Light theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button data-theme-choice="dark" aria-label="Dark theme" title="Dark theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>
<main>
  <div id="form"></div>
  <div class="side">
    <section>
      <h2>Run <span class="badge idle" id="state">idle</span></h2>
      <div class="actions">
        <button id="save">Save config</button>
        <button class="primary" id="start">Save &amp; start</button>
        <button class="danger" id="stop" disabled>Stop</button>
        <span class="dirty" id="dirty" hidden>Unsaved changes</span>
      </div>
      <div class="msg" id="msg" hidden></div>
      <div class="meta" id="elapsed"></div>
      <table id="stats" hidden>
        <thead><tr><th>LLM</th><th>Sent</th><th>Errors</th><th>Tool calls</th><th>p50</th><th>p95</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section>
      <h2>Log</h2>
      <div class="logs" id="logs"></div>
    </section>
  </div>
</main>

<script>
// Theme: "auto" follows the system setting; the choice is remembered in this browser.
function applyTheme(choice) {
  if (choice === "light" || choice === "dark") document.documentElement.dataset.theme = choice;
  else delete document.documentElement.dataset.theme;
  for (const b of document.querySelectorAll("[data-theme-choice]"))
    b.setAttribute("aria-pressed", String(b.dataset.themeChoice === (choice || "auto")));
}
let savedTheme = "auto";
try { savedTheme = localStorage.getItem("trafficgen-theme") || "auto"; } catch {}
applyTheme(savedTheme);
for (const b of document.querySelectorAll("[data-theme-choice]")) {
  b.addEventListener("click", () => {
    applyTheme(b.dataset.themeChoice);
    try { localStorage.setItem("trafficgen-theme", b.dataset.themeChoice); } catch {}
  });
}

const LLM_FIELDS = [
  { k: "name", label: "Name", type: "text" },
  { k: "model", label: "Model", type: "text" },
  { k: "base_url", label: "Base URL", type: "text", wide: true },
  { k: "chat_path", label: "Chat path", type: "text", placeholder: "/chat/completions" },
  { k: "api_key_env", label: "API key env var", type: "env" },
  { k: "api_key", label: "API key (inline)", type: "password", placeholder: "prefer env var" },
  { k: "requests_per_second", label: "Requests/sec override", type: "float", placeholder: "use global" },
  { k: "concurrency", label: "Concurrency override", type: "int", placeholder: "use global" },
  { k: "verify_ssl", label: "Verify SSL", type: "bool" },
  { k: "extra_headers", label: "Extra headers (Name: value, one per line)", type: "headers", wide: true },
];
const MCP_FIELDS = [
  { k: "name", label: "Name", type: "text" },
  { k: "base_url", label: "Base URL", type: "text", wide: true },
  { k: "api_key_env", label: "API key env var", type: "env" },
  { k: "api_key", label: "API key (inline)", type: "password", placeholder: "prefer env var" },
  { k: "verify_ssl", label: "Verify SSL", type: "bool" },
  { k: "extra_headers", label: "Extra headers (Name: value, one per line)", type: "headers", wide: true },
];
const TRAFFIC_FIELDS = [
  { k: "requests_per_second", label: "Requests/sec (per LLM)", type: "float" },
  { k: "concurrency", label: "Concurrency (per LLM)", type: "int" },
  { k: "duration_seconds", label: "Duration (seconds)", type: "float", placeholder: "until stopped" },
  { k: "total_requests", label: "Total requests", type: "int", placeholder: "no limit" },
  { k: "max_tool_call_rounds", label: "Max tool-call rounds", type: "int" },
  { k: "request_timeout_seconds", label: "Request timeout (seconds)", type: "float" },
];
const PROMPT_FIELDS = [
  { k: "file", label: "Prompts file (one per line, relative to config)", type: "text", wide: true },
  { k: "list", label: "Inline prompts (one per line)", type: "lines", wide: true },
];
const OUTPUT_FIELDS = [
  { k: "log_file", label: "JSONL log file", type: "text", nullable: true, placeholder: "blank = don't write a log" },
  { k: "summary_interval_seconds", label: "Console summary interval (seconds)", type: "float" },
];
const NEW_LLM = { name: "", base_url: "", chat_path: "/chat/completions", model: "", verify_ssl: false };
const NEW_MCP = { name: "", base_url: "", verify_ssl: false };

let config = null;
let envStatus = {};
const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) e.setAttribute(k, v);
  }
  for (const c of children) if (c !== null && c !== undefined) e.append(c);
  return e;
}

function setDirty(d) { $("dirty").hidden = !d; }

function setField(obj, k, v, nullable) {
  if (nullable && v === "") obj[k] = null;
  else if (v === undefined || v === null || v === "" || (typeof v === "number" && isNaN(v))) delete obj[k];
  else obj[k] = v;
  setDirty(true);
}

function headersToText(h) { return Object.entries(h || {}).map(([k, v]) => `${k}: ${v}`).join("\n"); }
function textToHeaders(t) {
  const out = {};
  for (const line of t.split("\n")) {
    const i = line.indexOf(":");
    if (i > 0) out[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  return Object.keys(out).length ? out : undefined;
}

function field(obj, f) {
  const v = obj[f.k];
  const cls = f.wide ? "wide" : "";
  if (f.type === "bool") {
    return el("label", { class: "check " + cls },
      el("input", { type: "checkbox", ...(v ? { checked: "" } : {}),
        onchange: (e) => setField(obj, f.k, e.target.checked) }), f.label);
  }
  let input;
  if (f.type === "headers" || f.type === "lines") {
    const text = f.type === "headers" ? headersToText(v) : (v || []).join("\n");
    input = el("textarea", { rows: f.type === "lines" ? 6 : 2, placeholder: f.placeholder });
    input.value = text;
    input.addEventListener("input", (e) => setField(obj, f.k, f.type === "headers"
      ? textToHeaders(e.target.value)
      : (e.target.value.split("\n").map((s) => s.trim()).filter(Boolean))));
  } else {
    const numeric = f.type === "int" || f.type === "float";
    input = el("input", {
      type: f.type === "password" ? "password" : numeric ? "number" : "text",
      step: f.type === "float" ? "any" : f.type === "int" ? "1" : undefined,
      min: numeric ? "0" : undefined,
      placeholder: f.placeholder, autocomplete: "off", spellcheck: "false",
    });
    input.value = v ?? "";
    input.addEventListener("input", (e) => {
      const s = e.target.value;
      setField(obj, f.k, f.type === "int" ? parseInt(s, 10) : f.type === "float" ? parseFloat(s) : s.trim(), f.nullable);
    });
  }
  let tag = null;
  if (f.type === "env" && v && v in envStatus) {
    tag = envStatus[v]
      ? el("span", { class: "envtag ok" }, "✓ set in server environment")
      : el("span", { class: "envtag missing" }, "✗ not set in server environment");
  }
  return el("label", { class: cls }, f.label, input, tag);
}

function grid(obj, fields) { return el("div", { class: "grid" }, ...fields.map((f) => field(obj, f))); }

function listSection(title, hint, key, fields, template) {
  const items = config[key] || (config[key] = []);
  const cards = items.map((item, i) =>
    el("div", { class: "card" },
      el("div", { class: "card-head" }, item.name || `(unnamed #${i + 1})`,
        el("button", { class: "small danger", onclick: () => { items.splice(i, 1); setDirty(true); render(); } }, "Remove")),
      grid(item, fields)));
  return el("section", {},
    el("h2", {}, el("span", {}, title, " ", el("span", { class: "hint" }, hint)),
      el("button", { class: "small", onclick: () => { items.push({ ...template }); setDirty(true); render(); } }, "+ Add")),
    ...cards);
}

function render() {
  for (const s of ["traffic", "prompts", "output"]) config[s] = config[s] || {};
  $("form").replaceChildren(
    listSection("LLMs", "OpenAI-compatible chat endpoints", "llms", LLM_FIELDS, NEW_LLM),
    listSection("MCP servers", "tools from every server go to every LLM", "mcp_servers", MCP_FIELDS, NEW_MCP),
    el("section", {}, el("h2", {}, "Traffic"), grid(config.traffic, TRAFFIC_FIELDS)),
    el("section", {}, el("h2", {}, "Prompts"), grid(config.prompts, PROMPT_FIELDS)),
    el("section", {}, el("h2", {}, "Output"), grid(config.output, OUTPUT_FIELDS)),
  );
}

function showMsg(text, kind) {
  const m = $("msg");
  m.hidden = !text; m.textContent = text || ""; m.className = "msg " + (kind || "");
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function load() {
  const data = await api("GET", "/api/config");
  config = data.config; envStatus = data.env || {};
  $("path").textContent = data.path + (data.exists ? "" : "  (new file — will be created on save)");
  render(); setDirty(false);
}

async function save() {
  const data = await api("PUT", "/api/config", config);
  envStatus = data.env || {};
  render(); setDirty(false);
}

$("save").onclick = async () => {
  try { await save(); showMsg("Saved.", "ok"); } catch (e) { showMsg(e.message, "err"); }
};
$("start").onclick = async () => {
  try { await save(); await api("POST", "/api/start"); showMsg(""); poll(); }
  catch (e) { showMsg(e.message, "err"); }
};
$("stop").onclick = async () => { try { await api("POST", "/api/stop"); poll(); } catch (e) { showMsg(e.message, "err"); } };

function fmt(n) { return n === null || n === undefined ? "–" : n.toFixed(2) + "s"; }
function dur(s) { s = Math.floor(s); return `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`; }

let lastLogCount = -1;
async function poll() {
  let s;
  try { s = await api("GET", "/api/status"); } catch { return; }
  const badge = $("state");
  badge.textContent = s.state; badge.className = "badge " + s.state;
  const active = s.state === "running" || s.state === "stopping";
  $("start").disabled = active;
  $("stop").disabled = !active;
  $("stop").textContent = s.state === "stopping" ? "Force stop" : "Stop";
  if (s.state === "error" && s.error) showMsg("Run failed: " + s.error, "err");

  if (s.started_at) {
    const end = s.ended_at || Date.now() / 1000;
    $("elapsed").textContent = (active ? "Running for " : "Ran for ") + dur(end - s.started_at);
  }
  const rows = Object.entries(s.stats || {});
  $("stats").hidden = !rows.length;
  $("stats").tBodies[0].replaceChildren(...rows.map(([name, r]) => el("tr", {},
    el("td", {}, name), el("td", {}, String(r.sent)), el("td", {}, String(r.errors)),
    el("td", {}, String(r.tool_calls)), el("td", {}, fmt(r.p50)), el("td", {}, fmt(r.p95)))));

  const logs = $("logs");
  const key = s.logs.length + "|" + (s.logs[s.logs.length - 1] || "");
  if (key !== lastLogCount) {
    const atBottom = logs.scrollHeight - logs.scrollTop - logs.clientHeight < 30;
    logs.textContent = s.logs.join("\n");
    if (atBottom) logs.scrollTop = logs.scrollHeight;
    lastLogCount = key;
  }
}

window.addEventListener("beforeunload", (e) => { if (!$("dirty").hidden) e.preventDefault(); });
load().catch((e) => showMsg("Failed to load config: " + e.message, "err"));
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
